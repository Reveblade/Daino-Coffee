server {
    # Cloud Run sends traffic to $PORT (default 8080); listen must match.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sipariş uygulaması: düzgün path URL’leri (ör. /siparis/masa/{slug})
    location ^~ /siparis {
        try_files $uri /customer.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # QR menü: /t/{slug} -> sipariş uygulaması
    location ~ ^/t/([^/]+)$ {
        return 302 /siparis/masa/$1;
    }
}
